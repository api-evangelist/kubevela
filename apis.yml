    name: KubeVela Application API
    description: >-
      KubeVela uses Kubernetes CRDs to define applications using the Open
      Application Model. The Application resource combines components (workload
      definitions), traits (operational capabilities like scaling and rollout),
      and policies (deployment strategies). VelaQL provides a query interface
      for application status across clusters.
