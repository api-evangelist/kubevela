aid: kubevela
name: KubeVela
description: >-
  KubeVela is a CNCF incubating application delivery and management platform
  that makes deploying and operating applications across hybrid and
  multi-cloud environments easier. Built on the Open Application Model (OAM),
  it provides a higher-level abstraction for defining applications with
  components, traits, and policies. KubeVela supports workflow-based
  delivery pipelines and multi-cluster deployment.
